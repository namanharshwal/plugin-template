name: Knip-reporter

on:
  workflow_run:
    workflows: ["Knip"]
    types:
      - completed
  workflow_call:
    inputs:
      reporter-action:
        description: "Action reference for knip reporter"
        required: false
        default: "ubiquity/knip-reporter@main"
        type: string
      artifact-name:
        description: "Name of the artifact containing knip results"
        required: false
        default: "knip-results"
        type: string
    secrets:
      token:
        description: "GitHub Token for posting PR comment"
        required: false

permissions: write-all

jobs:
  knip-reporter:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    steps:
      - name: Download knip results artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name || 'knip-results' }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.token || secrets.GITHUB_TOKEN }}

      - name: Read PR number
        id: pr-number
        uses: juliangruber/read-file-action@v1
        with:
          path: ./pr-number.txt
          trim: true

      - name: Report knip results to pull request
        uses: ubiquity/knip-reporter@main
        with:
          verbose: true
          comment_id: ${{ github.workflow }}-reporter
          command_script_name: knip-ci
          annotations: true
          ignore_results: false
          json_input: true
          json_input_file_name: knip-results.json
          pull_request_number: ${{ steps.pr-number.outputs.content }}
          token: ${{ secrets.token || secrets.GITHUB_TOKEN }}
