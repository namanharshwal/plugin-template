name: Run Jest testing suite

on:
  workflow_dispatch:
    inputs:
      package-manager:
        description: "Package manager to use: bun, yarn, npm, or pnpm"
        required: false
        default: "bun"
        type: string
      bun-version:
        description: "Bun version to setup (if using bun)"
        required: false
        default: "latest"
        type: string
      node-version:
        description: "Node.js version to setup (if using yarn/npm/pnpm)"
        required: false
        default: "24.x"
        type: string
      test-command:
        description: "Custom test command to run (leave blank for default)"
        required: false
        default: ""
        type: string
      install-command:
        description: "Custom install command to run (leave blank for default)"
        required: false
        default: ""
        type: string
      working-directory:
        description: "Working directory for test execution"
        required: false
        default: "."
        type: string
      dashboard-file:
        description: "Path to test dashboard markdown file for step summary"
        required: false
        default: "test-dashboard.md"
        type: string
  pull_request:
  workflow_call:
    inputs:
      package-manager:
        description: "Package manager to use: bun, yarn, npm, or pnpm"
        required: false
        default: "bun"
        type: string
      bun-version:
        description: "Bun version to setup (if using bun)"
        required: false
        default: "latest"
        type: string
      node-version:
        description: "Node.js version to setup (if using yarn/npm/pnpm)"
        required: false
        default: "24.x"
        type: string
      test-command:
        description: "Custom test command to run (leave blank for default)"
        required: false
        default: ""
        type: string
      install-command:
        description: "Custom install command to run (leave blank for default)"
        required: false
        default: ""
        type: string
      working-directory:
        description: "Working directory for test execution"
        required: false
        default: "."
        type: string
      dashboard-file:
        description: "Path to test dashboard markdown file for step summary"
        required: false
        default: "test-dashboard.md"
        type: string
    secrets:
      NODE_AUTH_TOKEN:
        description: "Auth token for private npm registries if needed"
        required: false

env:
  NODE_ENV: "test"

jobs:
  testing:
    permissions: write-all
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Setup Bun
        if: ${{ (inputs.package-manager || 'bun') == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version || 'latest' }}

      - name: Setup Node.js
        if: ${{ (inputs.package-manager || 'bun') != 'bun' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version || '24.x' }}
          token: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Setup pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@v4

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          INSTALL_CMD="${{ inputs.install-command }}"
          PKG_MGR="${{ inputs.package-manager || 'bun' }}"

          if [ -n "$INSTALL_CMD" ]; then
            eval "$INSTALL_CMD"
          elif [ "$PKG_MGR" = "bun" ]; then
            bun install --frozen-lockfile || bun install
          elif [ "$PKG_MGR" = "yarn" ]; then
            yarn install --immutable || yarn install
          elif [ "$PKG_MGR" = "pnpm" ]; then
            pnpm install --frozen-lockfile || pnpm install
          else
            npm ci || npm install
          fi

      - name: Run Jest With Coverage
        run: |
          TEST_CMD="${{ inputs.test-command }}"
          PKG_MGR="${{ inputs.package-manager || 'bun' }}"

          if [ -n "$TEST_CMD" ]; then
            eval "$TEST_CMD"
          elif [ "$PKG_MGR" = "bun" ]; then
            bun run test
          elif [ "$PKG_MGR" = "yarn" ]; then
            yarn test
          elif [ "$PKG_MGR" = "pnpm" ]; then
            pnpm test
          else
            npm test
          fi

      - name: Add Jest Report to Summary
        if: always()
        run: |
          DASHBOARD="${{ inputs.dashboard-file || 'test-dashboard.md' }}"
          if [ -f "$DASHBOARD" ]; then
            echo "$(cat "$DASHBOARD")" >> $GITHUB_STEP_SUMMARY
          fi
